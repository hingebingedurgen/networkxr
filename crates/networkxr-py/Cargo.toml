[package]
name = "networkxr-py"
description = "Python bindings for networkxr-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The name of the compiled module as Python sees it: networkxr._core
name = "_core"
# "cdylib" builds a C-compatible shared library, which is what a Python
# extension module is.
crate-type = ["cdylib"]

[dependencies]
networkxr-core = { path = "../networkxr-core" }
# abi3-py311: build against Python's stable ABI, so one wheel per platform
# works on every Python from 3.11 up.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "multiple-pymethods"] }
