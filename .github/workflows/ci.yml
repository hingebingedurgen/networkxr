# To use this workflow, move this file to .github/workflows/ in the repository.
#
# Runs on every push and pull request: Rust tests and lints, then the Python
# tests against the built extension on each supported platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p networkxr-core --all-targets -- -D warnings
      - run: cargo test -p networkxr-core

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        # Results are matched to these NetworkX releases exactly. Add each new
        # release here; the conformance run below shows what it changed.
        networkx: ["3.6.1", "3.7"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin pytest numpy scipy networkx==${{ matrix.networkx }}
      - run: maturin build --release -o dist
      # Install the wheel by path, never by name: the name may also exist on
      # PyPI as somebody else's package.
      - run: pip install --no-deps dist/*.whl
        shell: bash
      # Our own tests: every accelerated function against NetworkX.
      - run: pytest tests -q
      # NetworkX's test-suite, run against networkxr, under both policies.
      - run: python -m networkxr.conformance -q
      - run: python -m networkxr.conformance -q
        env:
          NETWORKXR_POLICY: eager
