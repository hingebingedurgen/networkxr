[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "networkxrs"
description = "A drop-in speed-up for NetworkX: the same API, with the hot algorithms running in Rust."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/NetworkX.txt"]
requires-python = ">=3.12,!=3.14.1"
dependencies = ["networkx>=3.6"]
dynamic = ["version"]
keywords = ["graph", "network", "networkx", "rust", "algorithms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# pagerank needs numpy, as it does in NetworkX.
default = ["numpy>=1.25", "scipy>=1.11"]
test = ["pytest>=7", "numpy>=1.25", "scipy>=1.11"]

# `uv sync` installs these along with the project itself.
[dependency-groups]
dev = ["pytest>=7", "numpy>=1.25", "scipy>=1.11", "rustworkx", "rustnx>=0.1.0a3"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not only when
# pyproject.toml does.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

[tool.maturin]
manifest-path = "crates/networkxrs-py/Cargo.toml"
python-source = "python"
module-name = "networkxrs._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
